model:
  pretrained_model_path: "./GMTS/model/Qwen2.5-Math-1.5B"
  device: "cuda:6"
  dtype: "bfloat16"
  ref_model_device: "cuda:0"
  old_model_device: "cuda:0"

data:
  data_name: 'math'
  training_path: "./GMTS/GMTS-Framework1/test_data/math-500"
  testing_path: "./GMTS/GMTS-Framework1/test_data/math-500"
  test_size: 500

testing:
  batch_size:     125  

training:
  method:         "grpo" # 使用grpo
  random_seed:      0
  max_prompt_len:  1024
  max_gen_len:     2048

  batch_size              :  1024   # 512*16
  num_questions_per_batch :  64     # 一个step多少个question

  rollout_mini_batch      :  16     # rollout的时候, 每次走多少个question?
  mini_batch_size         :  64     # update的时候每次update过多少个question?
  micro_batch_size        :  4      # update的时候每次update计算几个? 
  kl_beta                 :  0.001  # kl-coef

  learning_rate: 3.0e-5             # 1.0e-6*16
  ckpt_dir: "./GMTS/GMTS-Framework1/result/ckpt_dir/Qwen2.5-math-1.5b-grpo-GMTS"
  log_dir: "./GMTS/GMTS-Framework1/result/log_dir/Qwen2.5-math-1.5b-grpo-GMTS"

  save_logp_gradient_path: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  save_true_gradient_path: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  save_entrpy_path: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  save_mask_path: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  save_adv_pth: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  save_prefix_pth: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  save_ids_path: ./GMTS/GMTS-Framework1/result/gradient_dir/Qwen2.5-math-1.5b-grpo-GMTS/
  
  ckpt_save_interval: 200
  gradient_interval : 200
  eval_interval     : 10

  # Number of examples per gradient accumulation step
  max_grad_norm: 1.0
  weight_decay: 0.0
  betas: [0.9, 0.999]
  memory_efficient_adamw: false
  
  clip_ratio_low       :   0.20  # low
  clip_ratio_high      :   0.28  # high
  use_entropy          :   true 
  selected_percent     :   0.8    
  use_TES_method       :   false
  use_GMTS_method      :   true 
  read_model_path      :   ""    
  doing_inverse        :   false 
  use_filter           :   false